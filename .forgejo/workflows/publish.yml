name: Publish
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "*/[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    name: Publish
    runs-on: sysbox
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: publish
        run: cargo run --package xtask-release
        env:
          INPUT_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
