[package]
name = "object-rainbow-amt"
version = "0.0.0-a.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "key-sorted distributed AMT"

[dependencies]
object-rainbow.workspace = true
object-rainbow-array-map.workspace = true
object-rainbow-parse-prefix.workspace = true
object-rainbow-point.workspace = true

async-executor = { workspace = true, optional = true }
flume = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["std"] }
genawaiter-try-stream.workspace = true

[features]
get-mut = ["object-rainbow/nested-mut"]
owp = ["dep:async-executor", "dep:flume", "object-rainbow/task-owp"]

[dev-dependencies]
object-rainbow = { workspace = true, features = ["owp-union"] }

macro_rules_attribute.workspace = true
smol.workspace = true
smol-macros.workspace = true
