[package]
name = "object-rainbow-json"
version = "0.0.0-a.24"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "serde_json for object-rainbow"

[dependencies]
object-rainbow = { workspace = true, features = ["serde"] }
object-rainbow-point = { workspace = true, features = [
    "point-serialize",
], optional = true }

futures-concurrency = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = { workspace = true, optional = true }

[features]
distributed = [
    "dep:object-rainbow-point",
    "dep:futures-concurrency",
    "dep:thiserror",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
