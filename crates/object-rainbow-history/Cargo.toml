[package]
name = "object-rainbow-history"
version = "0.0.0-a.37"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Git-ish diff-by-diff change history"

[dependencies]
object-rainbow.workspace = true
object-rainbow-apply.workspace = true
object-rainbow-chain-tree.workspace = true

futures-util.workspace = true

[dev-dependencies]
object-rainbow = { workspace = true, features = ["ulid"] }
object-rainbow-amt = { workspace = true, features = ["apply"] }
object-rainbow-apply.workspace = true
object-rainbow-trie = { workspace = true, features = ["apply"] }

macro_rules_attribute.workspace = true
smol.workspace = true
smol-macros.workspace = true
ulid = { workspace = true, default-features = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
