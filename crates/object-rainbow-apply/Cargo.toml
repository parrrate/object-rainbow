[package]
name = "object-rainbow-apply"
version = "0.0.0-a.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "asynchronous map trait for object-rainbow-history"

[dependencies]
object-rainbow.workspace = true
object-rainbow-point = { workspace = true, optional = true }

futures-concurrency.workspace = true
thiserror.workspace = true

[features]
point = ["dep:object-rainbow-point"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
macro_rules_attribute.workspace = true
smol.workspace = true
smol-macros.workspace = true
