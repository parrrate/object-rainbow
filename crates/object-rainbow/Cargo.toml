[package]
name = "object-rainbow"
version = "0.0.0-a.73"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "distributed object model"
documentation = "https://docs.rs/object-rainbow"
exclude = ["/.github", "/bin", "/.gitattribues", "/.gitignore", "/codegen.sh"]

[dependencies]
object-rainbow-derive = { version = "=0.0.0-a.27", path = "../object-rainbow-derive" }

anyhow.workspace = true
atomic-waker = { workspace = true, optional = true }
bitvec = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
cid = { workspace = true, optional = true }
flume = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
futures-concurrency.workspace = true
futures-core = { workspace = true, optional = true }
generic-array.workspace = true
ghost.workspace = true
hex = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
pin-project.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
sha2.workspace = true
sha2-const.workspace = true
thiserror.workspace = true
typenum.workspace = true
ulid = { workspace = true, optional = true }

[features]
bitvec = ["dep:bitvec"]
bytes = ["dep:bytes"]
cid = ["dep:cid"]
hex = ["dep:hex"]
indexmap = ["dep:indexmap"]
nested-mut = ["dep:futures-channel"]
serde = ["dep:serde"]
task-owp = ["dep:atomic-waker", "dep:flume", "dep:futures-core"]
ulid = ["dep:ulid"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "derive"
required-features = ["hex"]
