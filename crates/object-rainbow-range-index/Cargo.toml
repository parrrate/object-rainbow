[package]
name = "object-rainbow-range-index"
version = "0.0.0-a.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "range-filtered key-ordered queries"

[dependencies]
object-rainbow = { workspace = true, features = ["owp-union"] }
object-rainbow-apply = { workspace = true, optional = true }
object-rainbow-amt = { workspace = true, features = ["bulk2"] }

async-executor.workspace = true
futures-concurrency.workspace = true
multimap.workspace = true

[features]
apply = ["dep:object-rainbow-apply"]
